name: 每日中药材数据采集

on:
  schedule:
    # 每天北京时间18:00 (UTC 10:00)
    - cron: '0 10 * * *'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write  # 允许git push回仓库

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行采集
        run: python crawler/run_all.py

      - name: 提交数据
        run: |
          git config user.name "crawler-bot"
          git config user.email "crawler-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "自动采集: $(date +%Y-%m-%d)"
          git push
